[package]
name = "pp-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes = "0.8"
cbc = "0.1"
chrono = "0.4.45"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
pp-core = { version = "0.1.0", path = "../pp-core" }
prost = "0.14.6"
prost-types = "0.14.6"
roxmltree = "0.21.2"
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
thiserror = "2.0.21"
uuid = "1.26.1"
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }

[build-dependencies]
prost-build = "0.14.6"
protox = "0.10.0"
