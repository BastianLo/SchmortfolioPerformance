[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
repository = "https://github.com/BastianLo/SchmortfolioPerformance"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

[workspace.lints.clippy]
# amounts are written as `1234_56` (euros_cents) on purpose
inconsistent_digit_grouping = "allow"
mistyped_literal_suffixes = "allow"
too_many_arguments = "allow"
